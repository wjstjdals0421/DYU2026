<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | GSDD 2026</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">GSDD 2026</div>
        <nav>
            <ul class="nav-links">
                <li><a href="./gallery.html?view=project" id="nav-project">Works</a></li>
                <li><a href="./gallery.html?view=designer" id="nav-designer">Designers</a></li>
                <li><a href="../archive.html">Archive</a></li>
            </ul>
        </nav>
    </header>

    <main class="work-container">
        <div class="sub-tab-container" id="designer-sub-tabs">
            <button class="sub-tab active" data-major="All">전체</button>
            <button class="sub-tab" data-major="Visual">Visual</button>
            <button class="sub-tab" data-major="Space">Space</button>
        </div>
        <div id="gallery-content"></div>
    </main>

    <div id="modal-overlay">
        <div id="modal-content">
            <button class="close-btn">&times;</button>
            <div class="modal-left" id="modal-images"></div>
            <div class="modal-right">
                <div class="modal-info-top">
                    <div class="modal-author" id="modal-author-info"></div>
                    <h2 class="modal-title" id="modal-project-name"></h2>
                </div>
                <div class="modal-info-bottom">
                    <p class="modal-desc" id="modal-project-desc"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../main.js"></script>
    <script type="module" src="./gallery.js"></script>
</body>
</html>
