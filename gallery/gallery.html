<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | GSDD 2026</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">Finding Balance<br class="mobile-br"> In ___</div>
        <nav>
            <ul class="nav-links">
                <li><a href="../index.html#about" class="nav-link-about">About</a></li>
                <li><a href="./gallery.html?view=project" id="nav-project">Works</a></li>
                <li><a href="./gallery.html?view=designer" id="nav-designer">Designers</a></li>
                <li><a href="../archive.html">Archive</a></li>
            </ul>
        </nav>
        <button class="hamburger-btn" id="hamburger-btn" aria-label="메뉴 열기">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <!-- 모바일 드롭다운 세로 내비게이션 메뉴 -->
    <div class="mobile-menu-overlay" id="mobile-menu-overlay">
        <ul class="mobile-nav-links">
            <li><a href="../index.html#about" class="nav-link-about">About</a></li>
            <li><a href="./gallery.html?view=project">Works</a></li>
            <li><a href="./gallery.html?view=designer">Designers</a></li>
            <li><a href="../archive.html">Archive</a></li>
        </ul>
    </div>

    <main class="work-container">
        <!-- 전공 서브 탭 (All, Visual, Space) - Works & Designers 공통 적용 -->
        <div class="sub-tab-container visible" id="designer-sub-tabs">
            <button class="sub-tab active" data-major="All">All</button>
            <button class="sub-tab" data-major="Visual">Visual</button>
            <button class="sub-tab" data-major="Space">Space</button>
        </div>
        <div id="gallery-content"></div>
    </main>

    <div id="modal-overlay">
        <div id="modal-content">
            <button class="close-btn">&times;</button>
            <div class="modal-left" id="modal-images"></div>
            <div class="modal-right">
                <div class="modal-info-top">
                    <div class="modal-author-row">
                        <div class="modal-author" id="modal-author-info"></div>
                        <!-- 인스타그램 스타일 좋아요 버튼 (요청사항) -->
                        <button class="insta-like-btn" id="insta-like-btn" title="좋아요 누르기">
                            <svg class="heart-icon" viewBox="0 0 24 24">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                            <span class="like-count" id="modal-like-count">0</span>
                        </button>
                    </div>
                    <h2 class="modal-title" id="modal-project-name"></h2>
                </div>
                <div class="modal-info-bottom">
                    <p class="modal-desc" id="modal-project-desc"></p>
                </div>
                <!-- 상세페이지 우측 하단 방명록 (Guestbook) 코너 -->
                <div class="modal-guestbook-section">
                    <div class="guestbook-list" id="modal-guestbook-list">
                        <!-- 작성된 방명록 댓글이 동적으로 연동됨 -->
                    </div>
                    <form class="guestbook-form" id="guestbook-form">
                        <div class="guestbook-input-row">
                            <input type="text" id="guestbook-name-input" placeholder="이름 (닉네임)" required maxLength="15">
                            <button type="submit" class="guestbook-submit-btn">등록</button>
                        </div>
                        <textarea id="guestbook-msg-input" placeholder="축하 메시지나 응원의 한마디를 남겨주세요!" required maxLength="150" rows="2"></textarea>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../main.js"></script>
    <script type="module" src="./gallery.js"></script>
</body>
</html>
